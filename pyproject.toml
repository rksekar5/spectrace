[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrace"
version = "0.1.0"
description = "Explicit traceability between OpenSpec requirements and pytest sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0", "build==1.6.1"]

[project.scripts]
spectrace = "spectrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["requirements(*ids): explicit OpenSpec requirement identifiers exercised by a test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
